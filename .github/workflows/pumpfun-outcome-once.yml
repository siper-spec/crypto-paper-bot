name: Pump.fun historical outcome scan (one shot)
on:
  push:
    paths:
      - '.github/workflows/pumpfun-outcome-once.yml'
permissions:
  contents: write
  actions: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pumpfun-readonly-collector
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fetch captured launch artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p captured
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/13990903401/zip > /tmp/pumpfun-launches.zip
          unzip -o /tmp/pumpfun-launches.zip -d captured
          test -s captured/pumpfun-launches.jsonl
      - name: Fetch available public DEX outcomes
        run: python pumpfun/outcome_scan.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pumpfun-95-outcomes
          path: pumpfun/outcomes/
          if-no-files-found: warn
          retention-days: 14
      - name: Save report on research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pumpfun/outcomes/summary.json pumpfun/outcomes/token_outcomes.csv
          git commit -m "Store observed DEX outcomes for captured 95 launches"
          git push origin HEAD:pumpfun-readonly-collector
