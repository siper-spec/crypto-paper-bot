name: BOOST historical archive source audit (one shot)
on:
  push:
    paths:
      - '.github/workflows/boost-archive-audit-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pumpfun-readonly-collector
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests zstandard
      - name: Check historical BOOST event coverage
        run: python pumpfun/boost_archive_probe.py
      - name: Save audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boost-archive-coverage-test
          path: pumpfun/boost_probe_results/
          retention-days: 14
          if-no-files-found: warn
