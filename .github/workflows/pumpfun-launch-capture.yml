name: Pump.fun free launch capture
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: pumpfun-launch-capture
  cancel-in-progress: false

jobs:
  capture:
    # No additional data collection after the third workflow run.
    if: ${{ github.run_number <= 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: pumpfun-readonly-collector
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WebSocket client
        run: python -m pip install -r pumpfun/requirements.txt
      - name: Capture launches, never trade
        env:
          CAPTURE_SECONDS: '660'
        run: |
          mkdir -p captures
          python pumpfun/capture_batch.py --seconds "$CAPTURE_SECONDS" --out captures/pumpfun-launches.jsonl
      - name: Upload event file and summary, even if capture errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pumpfun-launches-${{ github.run_id }}
          path: captures/
          if-no-files-found: warn
          retention-days: 14

  stop_schedule:
    if: ${{ always() && github.run_number >= 3 }}
    needs: [capture]
    runs-on: ubuntu-latest
    steps:
      - name: Disable this workflow after third run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/pumpfun-launch-capture.yml/disable"
          echo "Pump.fun collector schedule disabled after workflow run #$GITHUB_RUN_NUMBER."
