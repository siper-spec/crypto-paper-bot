name: BOOST five-minute migration proxy (one shot)
on:
  push:
    paths:
      - '.github/workflows/boost-five-minute-proxy-once.yml'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pumpfun-readonly-collector
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests zstandard
      - name: Compile historical backtest
        run: python -m py_compile pumpfun/boost_migration_proxy.py
      - name: Analyze one archived hour of actual transactions
        run: python pumpfun/boost_migration_proxy.py
      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boost-migration-5min-proxy-results
          path: pumpfun/boost_backtest_results/
          if-no-files-found: warn
          retention-days: 14
