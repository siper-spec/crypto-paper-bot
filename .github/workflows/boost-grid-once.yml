name: BOOST migration holding-window comparison (one shot)
on:
  push:
    paths:
      - '.github/workflows/boost-grid-once.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pumpfun-readonly-collector
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests zstandard
      - name: Compile multi-window replay
        run: python -m py_compile pumpfun/boost_grid_backtest.py
      - name: Compare 0, 30, 60 second entries and multiple exits
        run: python pumpfun/boost_grid_backtest.py
      - name: Save all results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boost-grid-two-hour-replay-results
          path: pumpfun/boost_grid_results/
          if-no-files-found: warn
          retention-days: 14
